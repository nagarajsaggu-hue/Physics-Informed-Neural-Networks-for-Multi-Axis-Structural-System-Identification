data:
  csv: data/Stage1_Node3575_Z_Data.csv
  meta: data/Stage1_Node3575_Z_Meta.json
  modal: data/modal_results_Z.json
  observation_column: "Displacement_Z (m)"
  t_min: 0.0
  t_max: null

physics:
  mass: 5736762.0

  # Equivalent Mode-4 / Node-3575 Z force
  force_amplitude: -95073.0
  force_frequency: 15.0

scaling:
  displacement: 2.0e-7

  # Match the equivalent reduced-force scale
  force: 95073.0

network:
  layers: [1, 64, 64, 64, 64, 1]
  activation: "sin"
  initializer: "Glorot uniform"
  fourier_features:
    enabled: true
    n: 128
    f_min: 5.0
    f_max: 60.0

training:
  iterations: 30000
  learning_rate: 1.0e-3
  num_domain: 10000
  holdout_every: 5
  enforce_positive: true
  loss_weights: [1.0, 100.0]

  k_hat_init: 1.0
  c_hat_init: 2.0e-7

output:
  dir: outputs/phase1/Z